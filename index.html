<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Google Maps</title>
<style>
html,
body {
height: 100%;
margin: 0;
padding: 0;
}

#map {
height: 100%;
width: 100%;
}
body {
font-family: Arial, sans-serif;
}
.controls {
margin-bottom: 10px;
}
</style>
</head>
<body>
<h1>Route Tracking Map</h1>
<div class="controls">
<label for="destination">Choose Destination:</label>
<select id="destination">
<option value="7.1907,125.4553">Davao City</option>
<option value="7.0640,125.6095">Toril</option>
<option value="7.0850,125.4770">Lizada</option>
</select>
<button onclick="calculateRoute()">Get Route</button>
</div>
<div id="map"></div>

<script async
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDC7jJfgpwDI4SU8CmxD3OUsgIJ_OXpnl8&callback=initMap">
</script>

<script>
let map, directionsService, directionsRenderer;
let currentLocation;
let currentLocationMarker;
let destinationMarker;

function initMap() {
// Initialize map
map = new google.maps.Map(document.getElementById("map"), {
zoom: 12,
center: { lat: 7.1907, lng: 125.4553 } // Default center
});

directionsService = new google.maps.DirectionsService();
directionsRenderer = new google.maps.DirectionsRenderer();
directionsRenderer.setMap(map);

map.addListener("click", (e) => {
const destination = { lat: e.latLng.lat(), lng: e.latLng.lng() };

if (destinationMarker) {
destinationMarker.setMap(null);
}

destinationMarker = new google.maps.Marker({
position: destination,
map: map,
title: "Destination"
});

const destinationSelect = document.getElementById("destination");
const clickedValue = `${destination.lat},${destination.lng}`;
let clickedOption = destinationSelect.querySelector('option[data-clicked="1"]');
if (!clickedOption) {
clickedOption = document.createElement("option");
clickedOption.setAttribute("data-clicked", "1");
destinationSelect.appendChild(clickedOption);
}
clickedOption.value = clickedValue;
clickedOption.textContent = `Clicked: ${destination.lat.toFixed(5)}, ${destination.lng.toFixed(5)}`;
destinationSelect.value = clickedValue;

if (currentLocation) {
calculateRoute(destination);
}
});

// Get current location
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(
(position) => {
currentLocation = {
lat: position.coords.latitude,
lng: position.coords.longitude
};
map.setCenter(currentLocation);
if (currentLocationMarker) {
currentLocationMarker.setMap(null);
}

currentLocationMarker = new google.maps.Marker({
position: currentLocation,
map: map,
title: "Your Current Location"
});
},
() => {
alert("Unable to access your location. Default map center used.");
}
);
} else {
alert("Geolocation is not supported by this browser.");
}
}

function calculateRoute(destinationOverride) {
let destination;

if (destinationOverride) {
destination = destinationOverride;
} else {
const destValue = document.getElementById("destination").value;
const [lat, lng] = destValue.split(',').map(Number);
destination = { lat, lng };
}

if (!currentLocation) {
alert("Current location not available.");
return;
}

const request = {
origin: currentLocation,
destination: destination,
travelMode: google.maps.TravelMode.DRIVING
};

directionsService.route(request, (result, status) => {
if (status === "OK") {
directionsRenderer.setDirections(result);
} else {
alert("Could not calculate route: " + status);
}
});
}
</script>
</body>
</html>
